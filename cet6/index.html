<style>
/* Mode toggle */
.mode-toggle { display: inline-flex; gap: 0; margin-bottom: 24px; border: 1px solid #DEE2E6; border-radius: 6px; overflow: hidden; }
.mode-btn { padding: 6px 16px; font-size: 0.82rem; font-family: inherit; border: none; background: var(--bg); color: var(--fg-secondary); cursor: pointer; transition: all 0.15s ease; }
.mode-btn:hover { background: var(--bg-secondary); }
.mode-btn.active { background: var(--accent); color: #fff; }

/* Study sub-modes */
.study-modes { display: flex; gap: 8px; margin-bottom: 24px; }
.study-mode-btn { padding: 6px 14px; font-size: 0.8rem; font-family: inherit; border: 1px solid #DEE2E6; border-radius: 6px; background: var(--bg); color: var(--fg-secondary); cursor: pointer; transition: all 0.15s ease; }
.study-mode-btn:hover { border-color: var(--accent); color: var(--accent); }
.study-mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Search */
.search-box { padding: 8px 16px; }
.search-input { width: 100%; padding: 6px 10px; border: 1px solid #DEE2E6; border-radius: 6px; font-size: 0.82rem; font-family: inherit; color: var(--fg); outline: none; background: var(--bg); }
.search-input:focus { border-color: var(--accent); }
.search-result-count { font-size: 0.72rem; color: var(--fg-secondary); padding: 2px 16px 6px; }

/* Dictation mode */
.dictation-card { max-width: 500px; margin: 0 auto; text-align: center; padding: 40px 20px; }
.dictation-word { font-size: 2.5rem; font-weight: 600; color: var(--fg); margin-bottom: 32px; }
.dictation-input { width: 100%; max-width: 360px; padding: 10px 14px; border: 2px solid #DEE2E6; border-radius: 8px; font-size: 1rem; font-family: inherit; color: var(--fg); outline: none; text-align: center; margin-bottom: 16px; }
.dictation-input:focus { border-color: var(--accent); }
.dictation-input.correct { border-color: #37B24D; background: rgba(55,178,77,0.05); }
.dictation-input.wrong { border-color: #F03E3E; background: rgba(240,62,62,0.05); }
.dictation-feedback { font-size: 0.92rem; margin-bottom: 16px; min-height: 1.5em; }
.dictation-feedback.correct { color: #37B24D; }
.dictation-feedback.wrong { color: #F03E3E; }
.dictation-answer { font-size: 0.92rem; color: var(--fg-secondary); margin-bottom: 16px; }
.dictation-progress { font-size: 0.78rem; color: var(--fg-secondary); margin-bottom: 24px; }

/* Choice mode */
.choice-card { max-width: 500px; margin: 0 auto; padding: 40px 20px; }
.choice-question { font-size: 1.8rem; font-weight: 600; color: var(--fg); margin-bottom: 32px; text-align: center; }
.choice-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.choice-option { padding: 12px 16px; border: 2px solid #DEE2E6; border-radius: 8px; font-size: 0.95rem; cursor: pointer; transition: all 0.15s ease; text-align: left; font-family: inherit; background: var(--bg); color: var(--fg); }
.choice-option:hover { border-color: var(--accent); }
.choice-option.correct { border-color: #37B24D; background: rgba(55,178,77,0.08); color: #37B24D; }
.choice-option.wrong { border-color: #F03E3E; background: rgba(240,62,62,0.08); color: #F03E3E; }
.choice-option.disabled { pointer-events: none; opacity: 0.7; }
.choice-progress { font-size: 0.78rem; color: var(--fg-secondary); text-align: center; margin-bottom: 16px; }

/* Word mastery indicators */
.word-mastery { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.word-mastery.mastered { background: #37B24D; }
.word-mastery.learning { background: #F59F00; }
.word-mastery.difficult { background: #F03E3E; }
.word-mastery.new { background: #DEE2E6; }

/* Larger word display */
.word-item-word { font-size: 1.05rem !important; }
.word-title { font-size: 2.5rem !important; }

/* Etymology in word detail */
.word-etymology { margin-bottom: 36px; }
.word-etymology-label { font-size: 0.78rem; font-weight: 600; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.word-etymology-text { font-size: 0.95rem; line-height: 1.9; color: var(--fg-secondary); }

/* Study stats bar */
.study-stats { display: flex; gap: 16px; margin-bottom: 24px; padding: 12px 16px; background: var(--bg-secondary); border-radius: 8px; }
.study-stat { text-align: center; flex: 1; }
.study-stat-num { font-size: 1.2rem; font-weight: 600; color: var(--fg); }
.study-stat-label { font-size: 0.7rem; color: var(--fg-secondary); }

/* Submit/Next buttons */
.action-btn { padding: 8px 24px; border: none; border-radius: 6px; font-size: 0.88rem; font-family: inherit; cursor: pointer; transition: opacity 0.15s ease; }
.action-btn:hover { opacity: 0.85; }
.action-btn-primary { background: var(--accent); color: #fff; }
.action-btn-secondary { background: var(--bg-secondary); color: var(--fg-secondary); }

/* Search highlight */
.search-highlight { background: rgba(13,110,253,0.15); color: var(--accent); border-radius: 2px; padding: 0 1px; }

/* Study mode word-item meaning hidden */
.word-item-meaning-hidden { color: #CED4DA; letter-spacing: 2px; }
</style>
