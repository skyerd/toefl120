<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读主站 · TF120</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.reading-page { max-width: 680px; margin: 0 auto; padding: 80px 24px 120px; }
.reading-header { text-align: center; margin-bottom: 48px; }
.reading-header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
.reading-header p { font-size: 0.88rem; color: var(--fg-secondary); letter-spacing: 1px; }

.bookshelf {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 40px;
}
.book-card {
  background: var(--bg-secondary);
  border: 1px solid #E9ECEF;
  border-radius: 8px;
  padding: 16px 14px;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  display: flex; flex-direction: column; gap: 6px;
}
.book-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(13,110,253,0.08); }
.book-card-title {
  font-size: 0.85rem; font-weight: 500; color: var(--fg);
  line-height: 1.4;
}
.book-card-cat { font-size: 0.7rem; color: var(--accent); }
.book-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.book-card-tag { font-size: 0.65rem; color: var(--fg-secondary); background: var(--bg); padding: 1px 6px; border-radius: 3px; }

.reader-entry {
  border: 2px dashed #DEE2E6; border-radius: 12px;
  padding: 40px 24px; text-align: center;
  transition: border-color 0.2s ease, background 0.2s ease;
  cursor: pointer;
}
.reader-entry:hover { border-color: var(--accent); background: rgba(13,110,253,0.03); }
.reader-entry-icon { margin-bottom: 10px; color: var(--fg-secondary); }
.reader-entry-text { font-size: 0.88rem; color: var(--fg-secondary); margin-bottom: 4px; }
.reader-entry-hint { font-size: 0.75rem; color: #ADB5BD; }

.back-link {
  display: inline-block; margin-bottom: 32px;
  font-size: 0.85rem; color: var(--fg-secondary);
  text-decoration: none; cursor: pointer;
  transition: color 0.15s ease;
}
.back-link:hover { color: var(--accent); }

.section-label {
  font-size: 0.78rem; font-weight: 500; color: var(--fg-secondary);
  margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
}

/* ── Sidebars ── */
.reading-sidebar {
  position: fixed;
  top: 0;
  width: 280px;
  height: 100vh;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  transition: transform 0.25s ease;
}
.reading-sidebar-left {
  left: 0;
  transform: translateX(-100%);
  border-right: 1px solid #E9ECEF;
  box-shadow: 2px 0 12px rgba(0,0,0,0.06);
}
.reading-sidebar-left.open {
  transform: translateX(0);
}
.reading-sidebar-right {
  right: 0;
  transform: translateX(100%);
  border-left: 1px solid #E9ECEF;
  box-shadow: -2px 0 12px rgba(0,0,0,0.06);
}
.reading-sidebar-right.open {
  transform: translateX(0);
}
.reading-sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #E9ECEF;
  flex-shrink: 0;
}
.reading-sidebar-title {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--fg);
}
.reading-sidebar-close {
  width: 28px;
  height: 28px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--fg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
}
.reading-sidebar-close:hover {
  background: #F1F3F5;
  color: var(--fg);
}
.reading-sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}

/* ── Sidebar overlay (mobile) ── */
.reading-sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.2);
  z-index: 195;
  display: none;
}
.reading-sidebar-overlay.visible {
  display: block;
}

/* ── Toggle buttons ── */
.reading-sidebar-toggle {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 48px;
  background: var(--bg);
  border: 1px solid #E9ECEF;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-secondary);
  transition: all 0.15s ease;
  z-index: 190;
}
.reading-sidebar-toggle:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.reading-sidebar-toggle-left {
  left: 0;
  border-radius: 0 6px 6px 0;
  border-left: none;
}
.reading-sidebar-toggle-right {
  right: 0;
  border-radius: 6px 0 0 6px;
  border-right: none;
}
.reading-sidebar-toggle svg {
  width: 18px;
  height: 18px;
}

/* ── History items ── */
.history-item {
  padding: 12px 20px;
  border-bottom: 1px solid #F8F9FA;
  cursor: pointer;
  transition: background 0.1s ease;
}
.history-item:hover {
  background: #F8F9FA;
}
.history-item-title {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--fg);
  margin-bottom: 4px;
}
.history-item-stats {
  display: flex;
  gap: 12px;
}
.history-item-stat {
  font-size: 0.72rem;
  color: var(--fg-secondary);
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.history-item-stat svg {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}
.history-empty {
  padding: 24px 20px;
  text-align: center;
  font-size: 0.82rem;
  color: #ADB5BD;
}

/* ── Tracking sections ── */
.tracking-section {
  padding: 12px 20px;
}
.tracking-section + .tracking-section {
  border-top: 1px solid #F8F9FA;
}
.tracking-section-title {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--fg-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.tracking-section-title svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}
.tracking-item {
  padding: 6px 0;
  font-size: 0.82rem;
  color: var(--fg);
  cursor: pointer;
  transition: color 0.15s ease;
}
.tracking-item:hover {
  color: var(--accent);
}
.tracking-item-sub {
  font-size: 0.72rem;
  color: var(--fg-secondary);
}
.tracking-empty {
  font-size: 0.78rem;
  color: #ADB5BD;
  padding: 4px 0;
}
.tracking-badge {
  display: inline-block;
  font-size: 0.65rem;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  vertical-align: middle;
}
.tracking-badge-error {
  background: rgba(240,62,62,0.1);
  color: #F03E3E;
}
.tracking-badge-warn {
  background: rgba(245,159,0,0.1);
  color: #F59F00;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .bookshelf { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .reading-page { padding: 40px 16px 80px; }
  .reading-sidebar { width: 260px; }
}
</style>
</head>
<body>

<!-- Left sidebar toggle -->
<button class="reading-sidebar-toggle reading-sidebar-toggle-left" onclick="toggleReadingSidebar('left')" title="阅读历史">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  </svg>
</button>

<!-- Right sidebar toggle -->
<button class="reading-sidebar-toggle reading-sidebar-toggle-right" onclick="toggleReadingSidebar('right')" title="学习追踪">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
  </svg>
</button>

<!-- Overlay for mobile -->
<div class="reading-sidebar-overlay" id="reading-sidebar-overlay" onclick="closeReadingSidebars()"></div>

<!-- Left sidebar: 阅读历史 -->
<div class="reading-sidebar reading-sidebar-left" id="reading-sidebar-left">
  <div class="reading-sidebar-header">
    <span class="reading-sidebar-title">阅读历史</span>
    <button class="reading-sidebar-close" onclick="toggleReadingSidebar('left')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="reading-sidebar-body" id="reading-history-list"></div>
</div>

<!-- Right sidebar: 学习追踪 -->
<div class="reading-sidebar reading-sidebar-right" id="reading-sidebar-right">
  <div class="reading-sidebar-header">
    <span class="reading-sidebar-title">学习追踪</span>
    <button class="reading-sidebar-close" onclick="toggleReadingSidebar('right')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="reading-sidebar-body" id="reading-tracking-list"></div>
</div>

<!-- Main content -->
<div class="reading-page">
  <a class="back-link" onclick="location.href='company.html'">← 返回</a>
  <div class="reading-header">
    <h1>阅读主站</h1>
    <p>READ · LEARN · GROW</p>
  </div>

  <div class="section-label">课程</div>
  <div class="bookshelf" id="bookshelf"></div>

  <div class="section-label">文档阅读器</div>
  <div class="reader-entry" onclick="location.href='reader/'">
    <div class="reader-entry-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
    </div>
    <div class="reader-entry-text">打开本地文档</div>
    <div class="reader-entry-hint">支持 PDF、DOCX、TXT、Markdown、HTML 等格式，本地渲染不上传</div>
  </div>
</div>

<script src="books.js"></script>
<script>
/* ── Sidebar toggle ── */
function toggleReadingSidebar(side) {
  var el = document.getElementById('reading-sidebar-' + side);
  var overlay = document.getElementById('reading-sidebar-overlay');
  var isOpen = el.classList.contains('open');
  closeReadingSidebars();
  if (!isOpen) {
    el.classList.add('open');
    overlay.classList.add('visible');
  }
}
function closeReadingSidebars() {
  document.getElementById('reading-sidebar-left').classList.remove('open');
  document.getElementById('reading-sidebar-right').classList.remove('open');
  document.getElementById('reading-sidebar-overlay').classList.remove('visible');
}

/* ── Reading history tracking ── */
var HISTORY_KEY = 'reading_history';

function getReadingHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveReadingHistory(data) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(data));
}

function formatDuration(ms) {
  if (ms < 60000) return Math.round(ms / 1000) + '秒';
  if (ms < 3600000) return Math.round(ms / 60000) + '分钟';
  var h = Math.floor(ms / 3600000);
  var m = Math.round((ms % 3600000) / 60000);
  return h + '小时' + (m > 0 ? m + '分' : '');
}

// On page load, check if returning from a book and record time spent
(function recordTimeSpent() {
  var now = Date.now();
  var history = getReadingHistory();
  BOOKS.forEach(function(book) {
    var startKey = 'reading_start_' + book.id;
    var startStr = sessionStorage.getItem(startKey);
    if (startStr) {
      var start = parseInt(startStr, 10);
      var elapsed = now - start;
      if (elapsed > 0 && elapsed < 86400000) { // cap at 24h to avoid absurd values
        if (!history[book.id]) {
          history[book.id] = { visits: 0, totalTime: 0, lastVisit: 0, yesterdayTime: 0 };
        }
        history[book.id].visits++;
        history[book.id].totalTime += elapsed;
        history[book.id].lastVisit = now;
        // Track yesterday's time: if the visit started within the last 24-48 hours
        var hoursAgo = (now - start) / 3600000;
        if (hoursAgo < 24) {
          history[book.id].yesterdayTime = (history[book.id].yesterdayTime || 0) + elapsed;
        }
      }
      sessionStorage.removeItem(startKey);
    }
  });
  saveReadingHistory(history);
})();

/* ── Render book cards ── */
document.getElementById('bookshelf').innerHTML = BOOKS.map(function(b) {
  return '<div class="book-card" data-book-id="' + b.id + '" data-book-url="' + b.url + '">' +
    '<div class="book-card-cat">' + b.category + '</div>' +
    '<div class="book-card-title">' + b.title + '</div>' +
    '<div class="book-card-tags">' + b.tags.map(function(t) { return '<span class="book-card-tag">' + t + '</span>'; }).join('') + '</div>' +
  '</div>';
}).join('');

document.getElementById('bookshelf').addEventListener('click', function(e) {
  var card = e.target.closest('.book-card');
  if (!card) return;
  var bookId = card.getAttribute('data-book-id');
  var bookUrl = card.getAttribute('data-book-url');
  // Record start timestamp
  sessionStorage.setItem('reading_start_' + bookId, String(Date.now()));
  sessionStorage.setItem('from_reading', '1');
  // Navigate
  location.href = bookUrl;
});

/* ── Render left sidebar: reading history ── */
function renderReadingHistory() {
  var container = document.getElementById('reading-history-list');
  var history = getReadingHistory();
  var items = BOOKS.filter(function(b) { return history[b.id]; });

  if (items.length === 0) {
    container.innerHTML = '<div class="history-empty">暂无阅读记录</div>';
    return;
  }

  // Sort by lastVisit descending
  items.sort(function(a, b) { return (history[b.id].lastVisit || 0) - (history[a.id].lastVisit || 0); });

  container.innerHTML = items.map(function(book) {
    var h = history[book.id];
    var avgTime = h.visits > 0 ? h.totalTime / h.visits : 0;
    return '<div class="history-item" onclick="location.href=\'' + book.url + '\'">' +
      '<div class="history-item-title">' + book.title + '</div>' +
      '<div class="history-item-stats">' +
        '<span class="history-item-stat">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
          '平均 ' + formatDuration(avgTime) +
        '</span>' +
        '<span class="history-item-stat">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
          '昨日 ' + formatDuration(h.yesterdayTime || 0) +
        '</span>' +
        '<span class="history-item-stat">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
          h.visits + '次' +
        '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ── Render right sidebar: tracking ── */
function renderReadingTracking() {
  var container = document.getElementById('reading-tracking-list');
  var now = Date.now();
  var DAY = 86400000;
  var WEEK = 7 * DAY;
  var html = '';

  // 1. 最近标签
  var history = getReadingHistory();
  var recentTags = [];
  var staleTags = [];
  var allTags = {};

  BOOKS.forEach(function(book) {
    book.tags.forEach(function(tag) {
      if (!allTags[tag]) allTags[tag] = { lastVisit: 0, books: [] };
      allTags[tag].books.push(book);
      if (history[book.id] && history[book.id].lastVisit) {
        if (history[book.id].lastVisit > allTags[tag].lastVisit) {
          allTags[tag].lastVisit = history[book.id].lastVisit;
        }
      }
    });
  });

  Object.keys(allTags).forEach(function(tag) {
    if (allTags[tag].lastVisit > 0 && (now - allTags[tag].lastVisit) < WEEK) {
      recentTags.push(tag);
    } else if (allTags[tag].lastVisit > 0) {
      staleTags.push(tag);
    }
  });

  // Recent tags section
  html += '<div class="tracking-section">';
  html += '<div class="tracking-section-title">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>' +
    '最近标签</div>';
  if (recentTags.length > 0) {
    recentTags.forEach(function(tag) {
      html += '<div class="tracking-item">' + tag + '</div>';
    });
  } else {
    html += '<div class="tracking-empty">暂无最近标签</div>';
  }
  html += '</div>';

  // Stale tags section
  html += '<div class="tracking-section">';
  html += '<div class="tracking-section-title">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
    '很久没看的标签</div>';
  if (staleTags.length > 0) {
    staleTags.forEach(function(tag) {
      html += '<div class="tracking-item">' + tag +
        '<span class="tracking-badge tracking-badge-warn">7天+</span></div>';
    });
  } else {
    html += '<div class="tracking-empty">所有标签都在活跃中</div>';
  }
  html += '</div>';

  // 2. Error words from CET6
  var cet6Data = null;
  try { cet6Data = JSON.parse(localStorage.getItem('cet6_progress')); } catch(e) {}

  var frequentErrors = [];
  var recentErrors = [];

  if (cet6Data && typeof cet6Data === 'object') {
    Object.keys(cet6Data).forEach(function(word) {
      var entry = cet6Data[word];
      if (!entry || typeof entry !== 'object') return;
      var wrong = entry.wrong || 0;
      var lastStudied = entry.lastStudied || 0;

      if (wrong > 3) {
        frequentErrors.push({ word: word, wrong: wrong });
      }
      if (wrong > 0 && lastStudied > 0 && (now - lastStudied) < DAY) {
        recentErrors.push({ word: word, wrong: wrong });
      }
    });
  }

  // Frequent errors section
  html += '<div class="tracking-section">';
  html += '<div class="tracking-section-title">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
    '经常错误的单词</div>';
  if (frequentErrors.length > 0) {
    frequentErrors.forEach(function(item) {
      html += '<div class="tracking-item">' + item.word +
        '<span class="tracking-badge tracking-badge-error">错' + item.wrong + '次</span></div>';
    });
  } else {
    html += '<div class="tracking-empty">暂无经常错误的单词</div>';
  }
  html += '</div>';

  // Recent errors section
  html += '<div class="tracking-section">';
  html += '<div class="tracking-section-title">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
    '刚刚错误的单词</div>';
  if (recentErrors.length > 0) {
    recentErrors.forEach(function(item) {
      html += '<div class="tracking-item">' + item.word +
        '<span class="tracking-badge tracking-badge-warn">错' + item.wrong + '次</span></div>';
    });
  } else {
    html += '<div class="tracking-empty">暂无最近错误</div>';
  }
  html += '</div>';

  container.innerHTML = html;
}

/* ── Initialize ── */
renderReadingHistory();
renderReadingTracking();
</script>
</body>
</html>
